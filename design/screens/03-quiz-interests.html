<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz: interests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
.avi{image-rendering:pixelated;mix-blend-mode:multiply;object-fit:contain}
input:focus{outline:3px solid #D9894A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF6E8; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; display: flex; flex-direction: column; padding: 58px 18px 30px; gap: 16px">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="QuizName.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 2px solid #EED9BF; display: grid; place-items: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B2418" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="flex-grow: 1; height: 14px; border-radius: 999px; background: #EED9BF; overflow: hidden"><div style="width: 20%; height: 100%; border-radius: 999px; background: #D9894A"></div></div>
    <span style="font-size: 14px; font-weight: 800; color: #7A5A45">3/15</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="width: 76px; height: 76px; border-radius: 999px; background: #FCEBD3; display: grid; place-items: center; flex: none"><img class="avi" src="/_blob/8a179e8ed31ad24d65845f676910d08e" alt="Avi with an idea" style="width: 70px; height: 70px"></div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <h1 style="margin: 0; font-size: 23px; font-weight: 900; line-height: 28px">What does {{kid}} love?</h1>
      <span style="font-size: 14px; line-height: 19px; font-weight: 600; color: #7A5A45">Pick as many as you like. They go into {{kidPos}} stories and games.</span>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{items}}" as="i" hint-placeholder-count="16">
      <button type="button" onClick="{{i.pick}}" aria-pressed="{{i.pressed}}" style="width: 100%; height: 84px; border-radius: 18px; border: {{i.border}}; background: {{i.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px 2px; box-sizing: border-box; cursor: pointer; font: 800 12.5px/15px Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; position: relative">
        <span style="width: 34px; height: 34px; border-radius: 999px; background: {{i.color}}; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg></span>
        <span>{{i.label}}</span>
        <sc-if value="{{i.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 5px; top: 5px; width: 18px; height: 18px; border-radius: 999px; background: #D63B2F; display: grid; place-items: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></sc-if>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="other" style="font-size: 15px; font-weight: 800">Something else {{kid}} loves?</label>
    <input id="other" type="text" value="{{other}}" onChange="{{onOther}}" placeholder="For example: volcanoes, a cat called Pepper" style="height: 50px; border-radius: 16px; border: 2px solid #EED9BF; background: #FFFFFF; padding: 0 14px; font: 700 16px Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; box-sizing: border-box">
  </div>
  <div style="flex-grow: 1"></div>
  <a href="QuizMore.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #D63B2F; color: #FFFFFF; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 5px 0 #A8281E">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
kidNames() {
let v = '';
try { v = (localStorage.getItem('avilo.kid') || '').trim(); } catch (e) {}
const has = !!v;
const K = has ? v : 'your child';
const KC = has ? v : 'Your child';
const KP = has ? v + (/s$/i.test(v) ? "'" : "'s") : "your child's";
const KPC = has ? KP : "Your child's";
return { K: K, KC: KC, KP: KP, KPC: KPC, KPU: KP.toUpperCase(), KI: has ? v.charAt(0).toUpperCase() : '?' };
}
renderVals() {
const n = this.kidNames();
return Object.assign({ kid: n.K, kidCap: n.KC, kidPos: n.KP, kidPosCap: n.KPC, kidPosUpper: n.KPU, kidInitial: n.KI }, this._rv());
}
_rv() {
const { K, KC, KP, KPC } = this.kidNames();
const picked = (this.state && this.state.picked) || { dino: true, space: true, animals: true, art: true };
const defs = [
{ id: 'dino', label: 'Dinosaurs', color: '#4E9F3D', d: 'M4 17c0-5 3-9 8-9 2 0 3-2 5-2s3 1 3 3-2 2-3 2c0 4-2 6-5 6v2M8 17v2' },
{ id: 'space', label: 'Space', color: '#8466D6', d: 'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z' },
{ id: 'animals', label: 'Animals', color: '#D9894A', d: 'M7 11a2 2 0 1 0 0-.1M17 11a2 2 0 1 0 0-.1M10 7a2 2 0 1 0 0-.1M14 7a2 2 0 1 0 0-.1M8 18c0-3 2-5 4-5s4 2 4 5c0 1.5-2 1.5-4 1s-4 .5-4-1z' },
{ id: 'ocean', label: 'Ocean', color: '#2F86C9', d: 'M3 15c2 0 2-2 4.5-2s2.5 2 4.5 2 2-2 4.5-2 2.5 2 4.5 2M3 19c2 0 2-2 4.5-2s2.5 2 4.5 2 2-2 4.5-2 2.5 2 4.5 2M12 4v6' },
{ id: 'vehicles', label: 'Cars & trains', color: '#A0531C', d: 'M3 15V11l2-4h10l3 4h3v4M3 15h18M7 18a2 2 0 1 0 0-.1M17 18a2 2 0 1 0 0-.1' },
{ id: 'music', label: 'Music', color: '#E46A8E', d: 'M9 18V5l11-2v13M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM20 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z' },
{ id: 'art', label: 'Drawing', color: '#D9894A', d: 'M4 20l4-1 11-11-3-3L5 16zM14 7l3 3' },
{ id: 'sports', label: 'Sports', color: '#D63B2F', d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18' },
{ id: 'fairy', label: 'Fairy tales', color: '#8466D6', d: 'M4 18h16l1-10-5 4-4-7-4 7-5-4z' },
{ id: 'robots', label: 'Robots', color: '#2F86C9', d: 'M6 8h12v10H6zM9 12h.01M15 12h.01M10 15h4M12 8V5M12 5h.01' },
{ id: 'cooking', label: 'Cooking', color: '#A0531C', d: 'M6 13h12v4a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3zM6 13a6 6 0 0 1 12 0M12 4v3' },
{ id: 'nature', label: 'Plants & bugs', color: '#4E9F3D', d: 'M12 21V11M12 11c0-4 3-7 8-7 0 5-3 7-8 7zM12 14c0-3-2-5-6-5 0 4 2 5 6 5z' },
{ id: 'building', label: 'Building', color: '#D63B2F', d: 'M4 20h16M6 20V10h5v10M13 20V5h5v15' },
{ id: 'superheroes', label: 'Superheroes', color: '#E46A8E', d: 'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6zM9 12l2 2 4-4' },
{ id: 'dance', label: 'Dancing', color: '#8466D6', d: 'M12 5a2 2 0 1 0 0-.1M12 8v6l-3 6M12 14l3 6M8 10l4-2 4 2' },
{ id: 'pets', label: 'Pets', color: '#D9894A', d: 'M5 9l2-5 3 4h4l3-4 2 5v5a7 7 0 0 1-14 0zM10 13h.01M14 13h.01' }
];
const items = defs.map((x) => {
const on = !!picked[x.id];
return { ...x, on: on, pressed: on ? 'true' : 'false', border: on ? '3px solid #D9894A' : '2px solid #EED9BF', bg: on ? '#FCEBD3' : '#FFFFFF', pick: () => this.setState({ picked: { ...picked, [x.id]: !on } }) };
});
const other = this.state && typeof this.state.other === 'string' ? this.state.other : '';
return { items: items, count: items.filter((x) => x.on).length, other: other, onOther: (e) => this.setState({ other: e.target.value }) };
}
}
</script>
</body>
</html>
