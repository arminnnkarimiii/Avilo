<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counting game: dino eggs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
.avi{image-rendering:pixelated;object-fit:contain}
.mul{mix-blend-mode:multiply}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.shake{animation:shake .45s ease-in-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.up{animation:up .32s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes f1{0%{transform:translate(0,-10px) rotate(0);opacity:1}100%{transform:translate(-30px,300px) rotate(300deg);opacity:0}}
@keyframes f2{0%{transform:translate(0,-10px) rotate(0);opacity:1}100%{transform:translate(20px,340px) rotate(-260deg);opacity:0}}
@keyframes f3{0%{transform:translate(0,-10px) rotate(0);opacity:1}100%{transform:translate(40px,280px) rotate(200deg);opacity:0}}
.cf{position:absolute;top:0;width:9px;height:9px;border-radius:2px;opacity:0;pointer-events:none}
.f1{animation:f1 1.5s ease-in forwards}.f2{animation:f2 1.7s ease-in forwards}.f3{animation:f3 1.4s ease-in forwards}
@keyframes tipin{0%{transform:translate(-120px,40px) rotate(-12deg)}70%{transform:translate(6px,0) rotate(3deg)}100%{transform:none}}
.tipin{animation:tipin .45s ease-out both}
@media (prefers-reduced-motion: reduce){.shake,.up,.f1,.f2,.f3,.tipin{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E3F3DD; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 18px; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="KidHome.dc.html" aria-label="Close game" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: grid; place-items: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B2418" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="flex-grow: 1; height: 16px; border-radius: 999px; background: #FFFFFF; overflow: hidden"><div style="width: 40%; height: 100%; border-radius: 999px; background: #4E9F3D"></div></div>
    <span style="font-size: 17px; font-weight: 900; color: #2F6B23">2 of 5</span>
  </div>
  <div style="display: flex; align-items: center; gap: 8px">
    <h1 style="margin: 0; font-size: 27px; line-height: 33px; font-weight: 900; flex-grow: 1">How many dino eggs are in the nest?</h1>
    <div style="display: flex; flex-direction: column; gap: 8px; flex: none">
      <button type="button" aria-label="Hear the question" style="width: 50px; height: 50px; border-radius: 999px; border: 0; background: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#2F86C9" d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6" fill="none" stroke="#2F86C9" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button type="button" onClick="{{showTip}}" aria-label="Get a tip from Avi" style="width: 50px; height: 50px; border-radius: 999px; border: 0; background: #F5B53D; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 0 #C98A1C"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3B2418" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
    </div>
  </div>
  <div style="height: 240px; border-radius: 28px; background: #FFFFFF; position: relative; display: flex; align-items: flex-end; justify-content: center; overflow: hidden">
    <div style="position: absolute; left: 30px; top: 26px; width: 70px; height: 70px; border-radius: 999px; background: #FCEBD3"></div>
    <div style="position: absolute; right: 40px; top: 40px; width: 40px; height: 40px; border-radius: 999px; background: #FCEBD3"></div>
    <div style="position: absolute; bottom: 22px; width: 270px; height: 70px; border-radius: 999px; background: #B8692F"></div>
    <div style="position: absolute; bottom: 44px; width: 250px; height: 40px; border-radius: 999px; background: #D9894A"></div>
    <div style="display: flex; gap: 10px; position: relative; margin-bottom: 54px">
      <sc-for list="{{eggs}}" as="e" hint-placeholder-count="4">
        <span style="width: 50px; height: 64px; border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; background: {{e.c}}; display: block; position: relative; box-shadow: inset -6px -6px 0 rgba(59, 36, 24, 0.12)"><span style="position: absolute; left: 12px; top: 16px; width: 10px; height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.7)"></span></span>
      </sc-for>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{answers}}" as="a" hint-placeholder-count="3">
      <button type="button" onClick="{{a.pick}}" class="{{a.cls}}" aria-label="{{a.n}} eggs" style="height: 96px; border-radius: 24px; border: 3px solid {{a.border}}; background: {{a.bg}}; box-shadow: 0 6px 0 {{a.shadow}}; font: 900 46px Nunito, ui-rounded, system-ui, sans-serif; color: {{a.fg}}; cursor: pointer">{{a.n}}</button>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <sc-if value="{{tip}}" hint-placeholder-val="{{false}}">
    <div class="tipin" style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: flex-end; gap: 6px">
      <img class="avi" src="/_blob/f44dde0afc81dc62738803f5cab9147e" alt="Avi with an idea" style="width: 120px; height: 110px; flex: none">
      <div style="flex-grow: 1; background: #FFFFFF; border: 3px solid #F5B53D; border-radius: 20px 20px 20px 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px">
        <span style="font-size: 17px; line-height: 23px; font-weight: 800">Touch each egg with your finger and say a number out loud!</span>
        <button type="button" onClick="{{hideTip}}" style="align-self: flex-start; padding: 6px 12px; border-radius: 999px; border: 0; background: #FCEBD3; font: 800 14px Nunito, ui-rounded, system-ui, sans-serif; color: #A0531C; cursor: pointer">Got it</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{right}}" hint-placeholder-val="{{false}}">
    <div class="up" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 18px 20px 32px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 24px rgba(59, 36, 24, 0.12)">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 96px; height: 96px; border-radius: 999px; background: #FCEBD3; display: grid; place-items: center; flex: none"><img class="avi mul" src="/_blob/02ed70c93c5cdb78ced2aded4bf8695b" alt="Avi cheering" style="width: 90px; height: 90px"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 26px; font-weight: 900; color: #2F6B23">You did it, Mila!</span><span style="font-size: 16px; font-weight: 800">4 eggs. <span style="color: #A0531C">+3 stars</span></span></div>
      </div>
      <a href="KidHome.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 999px; background: #4E9F3D; color: #FFFFFF; font-size: 20px; font-weight: 900; text-decoration: none; box-shadow: 0 5px 0 #2F6B23">Next</a>
    </div>
  </sc-if>
  <sc-if value="{{wrong}}" hint-placeholder-val="{{false}}">
    <div class="up" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 18px 20px 32px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 24px rgba(59, 36, 24, 0.12)">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 96px; height: 96px; border-radius: 999px; background: #FCEBD3; display: grid; place-items: center; flex: none"><img class="avi mul" src="/_blob/2689b009c7d552d9f0bd44bebc7b4054" alt="Avi thinking" style="width: 90px; height: 90px"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 26px; font-weight: 900; color: #A0531C">Great try!</span><span style="font-size: 16px; font-weight: 800">Let's count together one more time.</span></div>
      </div>
      <button type="button" onClick="{{retry}}" style="height: 60px; border-radius: 999px; border: 0; background: #D63B2F; color: #FFFFFF; font: 900 20px Nunito, ui-rounded, system-ui, sans-serif; box-shadow: 0 5px 0 #A8281E; cursor: pointer">Try again</button>
    </div>
  </sc-if>
  <sc-if value="{{burst}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; pointer-events: none">
      <sc-for list="{{pieces}}" as="p" hint-placeholder-count="0">
        <span class="cf {{p.k}}" style="left: {{p.x}}px; background: {{p.c}}; animation-delay: {{p.d}}s"></span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentWillUnmount() { clearTimeout(this.t); }
fire(gentle) {
clearTimeout(this.t);
this.setState({ burst: false });
setTimeout(() => this.setState({ burst: true, gentle: gentle }), 20);
this.t = setTimeout(() => this.setState({ burst: false }), 2000);
}
renderVals() {
const st = this.state || {};
const picked = st.picked;
const answers = [3, 4, 5].map((n) => {
const isPicked = picked === n;
const ok = n === 4;
return {
n: n,
cls: isPicked && !ok ? 'shake' : '',
pick: () => { this.setState({ picked: n, tip: false, tries: (st.tries || 0) + 1 }); this.fire(n !== 4); },
bg: isPicked ? (ok ? '#4E9F3D' : '#D63B2F') : '#FFFFFF',
fg: isPicked ? '#FFFFFF' : '#3B2418',
border: isPicked ? (ok ? '#2F6B23' : '#A8281E') : '#FFFFFF',
shadow: isPicked ? (ok ? '#2F6B23' : '#A8281E') : '#B9DDB0'
};
});
const colors = st.gentle ? ['#F5B53D', '#FCEBD3', '#E9A263'] : ['#F5B53D', '#D63B2F', '#2F86C9', '#4E9F3D', '#8466D6', '#E46A8E'];
const count = st.gentle ? 12 : 28;
const pieces = [];
for (let k = 0; k < count; k++) pieces.push({ x: (k * 53) % 380, c: colors[k % colors.length], k: ['f1', 'f2', 'f3'][k % 3], d: ((k * 7) % 10) / 25 });
return {
eggs: [{ c: '#F5B53D' }, { c: '#E46A8E' }, { c: '#2F86C9' }, { c: '#8466D6' }],
answers: answers, pieces: pieces, burst: !!st.burst,
right: picked === 4,
wrong: picked !== undefined && picked !== null && picked !== 4,
tip: !!st.tip,
showTip: () => this.setState({ tip: true }),
hideTip: () => this.setState({ tip: false }),
retry: () => this.setState({ picked: null })
};
}
}
</script>
</body>
</html>
