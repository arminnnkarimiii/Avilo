<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avi's room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
.px{image-rendering:pixelated}
.layer{position:absolute;image-rendering:pixelated;pointer-events:none}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.hop{animation:hop .45s ease-out}
@keyframes idle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.idle{animation:idle 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes toast{0%{transform:translateY(-20px);opacity:0}12%,85%{transform:none;opacity:1}100%{opacity:0}}
.toast{animation:toast 2.2s ease-out both}
@media (prefers-reduced-motion: reduce){.hop,.idle,.toast{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF6E8; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="height: 400px; position: relative; background: #F2C98F; flex: none; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #B8692F"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 116px; height: 8px; background: #A0531C"></div>
    <div style="position: absolute; left: 34px; top: 120px; width: 96px; height: 80px; border-radius: 14px; background: #DDEEFB; border: 6px solid #FFF6E8"></div>
    <div style="position: absolute; left: 80px; top: 120px; width: 6px; height: 80px; background: #FFF6E8"></div>
    <div style="position: absolute; right: 36px; top: 150px; width: 14px; height: 140px; background: #7A3E14"></div>
    <div style="position: absolute; right: 16px; top: 120px; width: 54px; height: 40px; border-radius: 30px 30px 6px 6px; background: #F5B53D"></div>
    <div style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: 250px; height: 46px; border-radius: 999px; background: #D63B2F"></div>
    <div style="position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); width: 200px; height: 30px; border-radius: 999px; background: #E8574A"></div>
    <div style="position: absolute; left: 18px; top: 54px; right: 18px; display: flex; align-items: center; gap: 10px; z-index: 3">
      <a href="KidHome.dc.html" aria-label="Back home" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: grid; place-items: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B2418" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <span style="font-size: 24px; font-weight: 900; flex-grow: 1">Avi's room</span>
      <span style="display: flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: #FFFFFF; font-size: 17px; font-weight: 900"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#F5B53D" d="M12 2l3 6.3 6.9.9-5 4.8 1.2 6.9L12 17.6 5.9 20.9l1.2-6.9-5-4.8 6.9-.9z"/></svg>{{stars}}</span>
    </div>
    <div class="{{hopCls}}" style="position: absolute; left: 50%; bottom: 46px; margin-left: -84px; width: 168px; height: 289px">
      <div class="idle" style="position: absolute; inset: 0">
        <img class="layer" src="/_blob/7d9d62f29d7d04f9c3e6fc67ffe18fbe" alt="Avi" style="left: 0; top: 0; width: 100%">
        <sc-for list="{{worn}}" as="w" hint-placeholder-count="1">
          <img class="layer" src="{{w.src}}" alt="{{w.name}}" style="left: {{w.left}}%; top: {{w.top}}%; width: {{w.width}}%">
        </sc-for>
      </div>
    </div>
    <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
      <div class="toast" style="position: absolute; left: 50%; top: 112px; transform: translateX(-50%); z-index: 4; padding: 8px 14px; border-radius: 999px; background: #3B2418; color: #FFF6E8; font-size: 14px; font-weight: 800; white-space: nowrap">{{toastText}}</div>
    </sc-if>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 28px 28px 0 0; margin-top: -24px; position: relative; z-index: 2; padding: 16px 16px 0">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #FCEBD3">
      <button type="button" onClick="{{tabWardrobe}}" aria-pressed="{{wardrobePressed}}" style="height: 40px; border-radius: 999px; border: 0; background: {{wardrobeBg}}; font: 900 15px Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; cursor: pointer">My wardrobe · {{ownedCount}}</button>
      <button type="button" onClick="{{tabShop}}" aria-pressed="{{shopPressed}}" style="height: 40px; border-radius: 999px; border: 0; background: {{shopBg}}; font: 900 15px Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; cursor: pointer">Star shop</button>
    </div>
    <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 0 24px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{shown}}" as="it" hint-placeholder-count="6">
          <button type="button" onClick="{{it.act}}" aria-label="{{it.aria}}" style="position: relative; height: 128px; border-radius: 20px; border: {{it.border}}; background: {{it.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; padding: 8px 4px; box-sizing: border-box; font-family: inherit; color: #3B2418; opacity: {{it.op}}">
            <img class="px" src="{{it.src}}" alt="" style="width: 70px; height: 62px; object-fit: contain">
            <span style="font-size: 13px; line-height: 15px; font-weight: 900; text-align: center">{{it.name}}</span>
            <span style="font-size: 11px; font-weight: 900; color: {{it.tagFg}}">{{it.tag}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentWillUnmount() { clearTimeout(this.t); }
flash(text) {
clearTimeout(this.t);
this.setState({ toast: false, hop: false });
setTimeout(() => this.setState({ toast: text, hop: true }), 20);
this.t = setTimeout(() => this.setState({ toast: false, hop: false }), 2300);
}
kidNames() {
let v = '';
try { v = (localStorage.getItem('avilo.kid') || '').trim(); } catch (e) {}
const has = !!v;
const K = has ? v : 'your child';
const KC = has ? v : 'Your child';
const KP = has ? v + (/s$/i.test(v) ? "'" : "'s") : "your child's";
const KPC = has ? KP : "Your child's";
return { K: K, KC: KC, KP: KP, KPC: KPC, KPU: KP.toUpperCase(), KI: has ? v.charAt(0).toUpperCase() : '?' };
}
renderVals() {
const n = this.kidNames();
return Object.assign({ kid: n.K, kidCap: n.KC, kidPos: n.KP, kidPosCap: n.KPC, kidPosUpper: n.KPU, kidInitial: n.KI }, this._rv());
}
_rv() {
const { K, KC, KP, KPC } = this.kidNames();
const s = this.state || {};
const I = [
{ id: 'fedora', name: 'Fedora', slot: 'head', src: '/_blob/7fb17821dfd6dd71cde50a5bc0035546', l: 9.2, t: -2.01, w: 82.76, price: 0, from: 'Starter' },
{ id: 'wizard', name: 'Wizard hat', slot: 'head', src: '/_blob/6102451b261d68c923278ba8fb95d96a', l: 13.79, t: -23.4, w: 73.56, price: 0, from: 'Rainbow Hills chest' },
{ id: 'beanie', name: 'Beanie', slot: 'head', src: '/_blob/baac7d8aa37636c655def4f6d57e1949', l: 17.93, t: -13.37, w: 65.29, price: 0, from: 'Starter' },
{ id: 'glasses', name: 'Round glasses', slot: 'face', src: '/_blob/614f788b6a1488047e6720ffbca67c6f', l: 25.29, t: 22.73, w: 50.57, price: 0, from: 'Starter' },
{ id: 'scarf', name: 'Cozy scarf', slot: 'neck', src: '/_blob/96fca1d07a98b0f3cf9f4e3d5ad16080', l: 25.29, t: 42.78, w: 50.57, price: 0, from: 'Starter' },
{ id: 'hoodie', name: 'Bear hoodie', slot: 'body', src: '/_blob/c471f4a1ca866f651be0bf8417052c85', l: 6.9, t: 40.11, w: 87.36, price: 0, from: 'Starter' },
{ id: 'sunglasses', name: 'Sunglasses', slot: 'face', src: '/_blob/cd08fd76545077955312e227b4f0f776', l: 21.84, t: 20.05, w: 57.47, price: 40 },
{ id: 'headphones', name: 'Headphones', slot: 'ears', src: '/_blob/0db5770972b141e7009696f2276f7cfb', l: -14.25, t: 1.34, w: 128.74, price: 60 },
{ id: 'satchel', name: 'Satchel', slot: 'side', src: '/_blob/2358adb4f404812af25e54af7ced9901', l: 57.47, t: 57.49, w: 39.08, price: 30 },
{ id: 'detective', name: 'Detective cap', slot: 'head', src: '/_blob/92b396d92edc28a3a85bc2f37089bda4', l: 13.79, t: -4.01, w: 73.56, price: 50 },
{ id: 'varsity', name: 'Varsity jacket', slot: 'body', src: '/_blob/cae429343c329d6dca4d184a62122d71', l: 5.75, t: 40.11, w: 89.66, price: 70 },
{ id: 'cape', name: 'Hero cape', slot: 'body', src: '/_blob/aefa88461e54b74a757cb6c3bdb81469', l: 5.75, t: 44.12, w: 89.66, chest: 'Pancake Valley chest' },
{ id: 'crown', name: 'Crown', slot: 'head', src: '/_blob/952d84ebfd442120a483bf88ca9e61b8', l: 27.59, t: -5.35, w: 45.98, chest: 'Fruit Forest chest' },
{ id: 'aviator', name: 'Aviator cap', slot: 'head', src: '/_blob/57e17e0b9a1909f846aff7365ec75491', l: 10.34, t: -9.36, w: 80.46, chest: 'Cloud Castle chest' }
];
const owned = s.owned || { fedora: 1, wizard: 1, beanie: 1, glasses: 1, scarf: 1, hoodie: 1 };
const eq = s.eq || { head: 'fedora' };
const stars = s.stars === undefined ? 128 : s.stars;
const tab = s.tab || 'wardrobe';
const order = ['body', 'neck', 'side', 'face', 'ears', 'head'];
const worn = order.map((slot) => I.find((i) => i.id === eq[slot])).filter(Boolean).map((i) => ({ src: i.src, name: i.name, left: i.l, top: i.t, width: i.w }));
const card = (i) => {
const isOwned = !!owned[i.id], isOn = eq[i.slot] === i.id;
if (tab === 'wardrobe') {
return { ...i, op: 1, border: isOn ? '3px solid #D63B2F' : '2px solid #EED9BF', bg: isOn ? '#FCE4EB' : '#FFF6E8',
tag: isOn ? 'Wearing' : 'Tap to wear', tagFg: isOn ? '#A8281E' : '#7A5A45', aria: (isOn ? 'Take off ' : 'Wear ') + i.name,
act: () => { const n = { ...eq }; if (isOn) delete n[i.slot]; else n[i.slot] = i.id; this.setState({ eq: n }); this.flash(isOn ? 'Taken off. Saved for ' + K + '.' : 'Saved! Avi wears it everywhere.'); } };
}
if (i.chest) return { ...i, op: .55, border: '2px dashed #C9AE92', bg: '#FFF6E8', tag: 'From ' + i.chest, tagFg: '#7A5A45', aria: i.name + ', from ' + i.chest, act: () => this.flash('Find it in the ' + i.chest + '!') };
if (isOwned) return { ...i, op: 1, border: '2px solid #4E9F3D', bg: '#E3F3DD', tag: 'Owned', tagFg: '#2F6B23', aria: i.name + ', owned', act: () => this.setState({ tab: 'wardrobe' }) };
const can = stars >= i.price;
return { ...i, op: can ? 1 : .6, border: '2px solid #EED9BF', bg: '#FFF6E8', tag: '★ ' + i.price, tagFg: can ? '#A0531C' : '#7A5A45', aria: 'Buy ' + i.name + ' for ' + i.price + ' stars',
act: () => { if (!can) { this.flash('You need ' + (i.price - stars) + ' more stars'); return; } this.setState({ stars: stars - i.price, owned: { ...owned, [i.id]: 1 }, eq: { ...eq, [i.slot]: i.id } }); this.flash('New! ' + i.name + ' is on Avi.'); } };
};
const list = tab === 'wardrobe' ? I.filter((i) => owned[i.id]) : I.filter((i) => !i.from || !owned[i.id]).filter((i) => i.price || i.chest);
return {
stars: stars, worn: worn, shown: list.map(card), ownedCount: Object.keys(owned).length,
toast: !!s.toast, toastText: s.toast || '', hopCls: s.hop ? 'hop' : '',
wardrobePressed: tab === 'wardrobe' ? 'true' : 'false', shopPressed: tab === 'shop' ? 'true' : 'false',
wardrobeBg: tab === 'wardrobe' ? '#FFFFFF' : 'transparent', shopBg: tab === 'shop' ? '#FFFFFF' : 'transparent',
tabWardrobe: () => this.setState({ tab: 'wardrobe' }), tabShop: () => this.setState({ tab: 'shop' })
};
}
}
</script>
</body>
</html>
