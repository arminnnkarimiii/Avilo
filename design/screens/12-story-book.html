<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI story book</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
.avi{image-rendering:pixelated;mix-blend-mode:multiply;object-fit:contain}
@keyframes turn{from{transform:perspective(900px) rotateY(-14deg);opacity:.4}to{transform:none;opacity:1}}
.turn{animation:turn .4s ease-out both}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.tw{animation:tw 2.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.turn,.tw{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2A1E17; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #FCEFDF; display: flex; flex-direction: column; padding: 56px 18px 28px; gap: 14px; position: relative; overflow: hidden">
  <span class="tw" style="position: absolute; left: 40px; top: 30px; width: 6px; height: 6px; background: #F7C25A"></span>
  <span class="tw" style="position: absolute; left: 300px; top: 44px; width: 8px; height: 8px; background: #F7C25A; animation-delay: .7s"></span>
  <span class="tw" style="position: absolute; left: 210px; top: 20px; width: 5px; height: 5px; background: #FCEFDF; animation-delay: 1.3s"></span>
  <div style="display: flex; align-items: center; gap: 12px; position: relative">
    <a href="KidHome.dc.html" aria-label="Close book" style="width: 44px; height: 44px; border-radius: 999px; background: #35261C; display: grid; place-items: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FCEFDF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <span style="font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #F7C25A">WRITTEN FOR MILA BY AVI</span>
      <span style="font-size: 16px; font-weight: 900; line-height: 20px">Mila and the Star-Counting Dinosaur</span>
    </div>
  </div>
  <sc-if value="{{cover}}" hint-placeholder-val="{{true}}">
    <div class="turn" style="flex-grow: 1; background: #8466D6; border-radius: 28px; display: flex; flex-direction: column; align-items: center; padding: 26px 22px; gap: 14px; position: relative; overflow: hidden">
      <div style="position: absolute; left: -40px; bottom: -40px; width: 200px; height: 200px; border-radius: 999px; background: #9B7BE0"></div>
      <div style="position: absolute; right: -30px; top: 60px; width: 120px; height: 120px; border-radius: 999px; background: #F5B53D"></div>
      <span style="position: relative; padding: 6px 12px; border-radius: 999px; background: #FFF6E8; color: #5A40A8; font-size: 13px; font-weight: 900">10 pages · 5 min · Little Cubs</span>
      <h2 style="position: relative; margin: 0; font-size: 34px; line-height: 38px; font-weight: 900; color: #FFFFFF; text-align: center; text-wrap: balance">Mila and the Star-Counting Dinosaur</h2>
      <div style="position: relative; width: 220px; height: 220px; border-radius: 999px; background: #FCEBD3; display: grid; place-items: center; margin-top: 4px"><img class="avi" src="/_blob/4b387dc2f7645d73c6b33a6ed6c14a18" alt="Avi reading" style="width: 196px; height: 196px"></div>
      <div style="position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px">
        <span style="padding: 5px 10px; border-radius: 999px; background: #5A40A8; font-size: 12px; font-weight: 800; color: #FFFFFF">Dinosaurs</span><span style="padding: 5px 10px; border-radius: 999px; background: #5A40A8; font-size: 12px; font-weight: 800; color: #FFFFFF">Space</span><span style="padding: 5px 10px; border-radius: 999px; background: #5A40A8; font-size: 12px; font-weight: 800; color: #FFFFFF">Pepper the cat</span><span style="padding: 5px 10px; border-radius: 999px; background: #5A40A8; font-size: 12px; font-weight: 800; color: #FFFFFF">Counting to 5</span>
      </div>
      <div style="flex-grow: 1"></div>
      <button type="button" onClick="{{open}}" style="position: relative; width: 100%; height: 58px; border-radius: 999px; border: 0; background: #D63B2F; color: #FFFFFF; font: 900 19px Nunito, ui-rounded, system-ui, sans-serif; box-shadow: 0 5px 0 #A8281E; cursor: pointer">Read with me</button>
    </div>
  </sc-if>
  <sc-if value="{{reading}}" hint-placeholder-val="{{false}}">
    <div class="turn" style="flex-grow: 1; background: #FFF6E8; border-radius: 28px; color: #3B2418; display: flex; flex-direction: column; overflow: hidden">
      <sc-if value="{{page.art}}" hint-placeholder-val="{{true}}">
        <div style="height: 290px; background: {{page.sky}}; position: relative; overflow: hidden">
          <div style="position: absolute; left: -30px; bottom: -60px; width: 260px; height: 160px; border-radius: 999px; background: {{page.hill}}"></div>
          <div style="position: absolute; right: -50px; bottom: -70px; width: 280px; height: 170px; border-radius: 999px; background: {{page.hill2}}"></div>
          <div style="position: absolute; right: 40px; top: 34px; width: 56px; height: 56px; border-radius: 999px; background: {{page.moon}}"></div>
          <span style="position: absolute; left: 14px; top: 14px; padding: 5px 10px; border-radius: 999px; background: rgba(255, 246, 232, 0.92); font-size: 12px; font-weight: 900; color: #5A40A8">AI painting</span>
          <span style="position: absolute; left: 14px; right: 14px; bottom: 14px; padding: 8px 10px; border-radius: 12px; background: rgba(255, 246, 232, 0.92); font-size: 12px; line-height: 16px; font-weight: 700; font-style: italic; color: #3B2418">{{page.prompt}}</span>
        </div>
      </sc-if>
      <div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
        <p style="margin: 0; font-size: 23px; line-height: 35px; font-weight: 800"><sc-for list="{{words}}" as="w" hint-placeholder-count="12"><span style="background: {{w.bg}}; border-radius: 6px; padding: 0 2px">{{w.t}}</span> </sc-for></p>
        <div style="flex-grow: 1"></div>
        <sc-if value="{{page.skill}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 8px; background: #E3F3DD; border-radius: 14px; padding: 8px 12px; font-size: 13px; font-weight: 800; color: #2F6B23"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F6B23" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>{{page.skill}}</div></sc-if>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; position: relative">
      <button type="button" onClick="{{prev}}" aria-label="Previous page" style="width: 60px; height: 60px; border-radius: 999px; border: 0; background: #35261C; display: grid; place-items: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FCEFDF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <button type="button" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 76px; height: 76px; border-radius: 999px; border: 0; background: #E8574A; display: grid; place-items: center; box-shadow: 0 5px 0 #B83A2F; cursor: pointer">
          <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#FFFFFF"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#FFFFFF"/></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></sc-if>
        </button>
        <span style="font-size: 14px; font-weight: 800; color: #CDB39C">Page {{num}} of 10 · Narrator voice</span>
      </div>
      <button type="button" onClick="{{next}}" aria-label="Next page" style="width: 60px; height: 60px; border-radius: 999px; border: 0; background: #35261C; display: grid; place-items: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FCEFDF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() { this.iv = setInterval(() => { const s = this.state || {}; if (s.reading && s.playing !== false) this.setState({ w: (s.w || 0) + 1 }); }, 420); }
componentWillUnmount() { clearInterval(this.iv); }
renderVals() {
const night = { sky: '#3B4F8F', hill: '#2F6B23', hill2: '#4E9F3D', moon: '#F7C25A' };
const dusk = { sky: '#E9A263', hill: '#B8692F', hill2: '#D9894A', moon: '#FFF6E8' };
const space = { sky: '#2A2340', hill: '#5A40A8', hill2: '#8466D6', moon: '#F7C25A' };
const pages = [
{ t: 'Mila lived in a cozy house with her cat, Pepper. Every night, she looked up at the stars.', art: true, ...dusk, prompt: 'Soft storybook painting: a girl with her cat at a bedroom window at dusk, warm lamp light, first stars.' },
{ t: 'One night, a little green dinosaur peeked through her window. "Hello! I’m Tops," he whispered.', art: false },
{ t: '"I fell from Star Valley in the sky," said Tops. "Can you help me get home?"', art: true, ...night, prompt: 'A small friendly green triceratops in a moonlit garden, looking up at the sky, gentle watercolor.' },
{ t: 'Mila grabbed her crayons. "Let’s draw a rocket!" Pepper meowed, "Me too!"', art: false, skill: 'New word: rocket' },
{ t: 'Swoosh! The rocket zoomed up, up, up, past one, two, three fluffy clouds.', art: true, ...night, prompt: 'A crayon-drawn rocket with a girl, a cat and a dinosaur flying past three fluffy clouds at night.', skill: 'Counting to 3' },
{ t: 'In space, the stars twinkled. "My home has five stars in a row," said Tops.', art: false },
{ t: 'Mila counted: one, two, three, four... "Only four! Where is the fifth star?"', art: true, ...space, prompt: 'Four bright stars in a row in a purple galaxy, the rocket floating nearby, cozy and magical.', skill: 'Counting to 5' },
{ t: 'Pepper pointed her paw. A tiny star was hiding behind the moon. "Five!"', art: false, skill: 'Counting to 5' },
{ t: 'Tops hugged Mila. "Thank you! You are the best star-counter in the whole sky."', art: true, ...space, prompt: 'The dinosaur hugging the girl on a glowing star path, the cat smiling, warm golden light.' },
{ t: 'Back in bed, Mila smiled. Up above, five stars twinkled, just for her. The end.', art: false, skill: 'Feeling: proud' }
];
const st = this.state || {};
const i = st.i || 0;
const page = pages[i];
const words = page.t.split(' ');
const wi = (st.w || 0) % (words.length + 4);
return {
cover: !st.reading, reading: !!st.reading,
page: page, num: i + 1,
words: words.map((t, k) => ({ t: t, bg: k === wi ? '#F5B53D' : 'transparent' })),
playing: st.playing !== false, paused: st.playing === false, playLabel: st.playing === false ? 'Play narration' : 'Pause narration',
open: () => this.setState({ reading: true, i: 0, w: 0 }),
toggle: () => this.setState({ playing: st.playing === false }),
prev: () => (i === 0 ? this.setState({ reading: false }) : this.setState({ i: i - 1, w: 0 })),
next: () => this.setState({ i: Math.min(pages.length - 1, i + 1), w: 0 })
};
}
}
</script>
</body>
</html>
